name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Unpack project
        run: |
          mkdir -p build-src
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP NOT FOUND!"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d build-src

      - name: Build Noomi DLC
        working-directory: build-src
        run: gradle build --no-daemon

      - name: Upload Noomi DLC
        uses: actions/upload-artifact@v4
        with:
          name: Noomi-DLC
          path: build-src/build/libs/*.jar
          if-no-files-found: error
