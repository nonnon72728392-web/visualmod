name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Unpack project
        run: |
          mkdir build-src
          unzip -q noomidlc-3_0_0-project.zip -d build-src
      - name: Build
        working-directory: build-src
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: noomidlc
          path: build-src/build/libs/noomidlc-3.0.0.jar
